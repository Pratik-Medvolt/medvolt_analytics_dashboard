services:
  web:
    build: .
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
      - static_volume:/app/staticfiles
      - type: bind
        source: ./google_credentials.json
        target: /app/google_credentials.json
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; h=(os.environ.get('DASHBOARD_HOST') or os.environ.get('ALLOWED_HOSTS','localhost')).split(',')[0].strip(); u.urlopen(u.Request('http://127.0.0.1:8000/healthz/',headers={'Host':h}),timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    networks:
      - default
      - edge
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.medvolt.entrypoints: "websecure"
      traefik.http.routers.medvolt.rule: "Host(`${DASHBOARD_HOST:?set DASHBOARD_HOST in .env}`)"
      traefik.http.routers.medvolt.tls.certresolver: "letsencrypt"
      traefik.http.services.medvolt.loadbalancer.server.port: "80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  edge:
    external: true
    name: web

volumes:
  sqlite_data:
  static_volume:
