services:
  web:
    build: .
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
      - static_volume:/app/staticfiles
      - type: bind
        source: ./google_credentials.json
        target: /app/google_credentials.json
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite_data:
  static_volume:
