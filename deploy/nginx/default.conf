map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Static assets are collected into the shared volume by the web
    # container's entrypoint. Filenames are content-hashed by WhiteNoise's
    # manifest storage, so they are safe to cache for a long time.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Unauthenticated liveness endpoint. Kept quiet in the access log
    # because monitoring hits it constantly.
    location /healthz/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        access_log off;
    }

    # Django admin has full write access to the analytics tables behind
    # nothing but a password. Restrict it to known networks.
    #
    # ACTION REQUIRED: uncomment the two allow lines below and replace the
    # ranges with your office / VPN CIDRs, then reload:
    #     docker compose restart nginx
    #
    # Leave it as-is only if you accept the admin being reachable from any
    # address on the internet.
    location /admin/ {
        # allow 203.0.113.0/24;    # office
        # allow 198.51.100.42/32;  # VPN gateway
        # deny  all;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
